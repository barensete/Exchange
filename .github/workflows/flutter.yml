name: Flutter

on:
  push:
    branches: [main, flutter-fasoresto]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La version minimale acceptée et la plus récente.
        flutter: ['3.38.1', '3.47.5']
    name: build (Flutter ${{ matrix.flutter }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - run: flutter pub get

      - name: Vérification du code
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Publier l'APK
        if: matrix.flutter == '3.47.5'
        uses: actions/upload-artifact@v4
        with:
          name: FasoResto-apk
          path: build/app/outputs/flutter-apk/app-release.apk
