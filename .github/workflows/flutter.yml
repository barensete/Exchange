name: Flutter

on:
  push:
    branches: [main, flutter-fasoresto]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - name: Vérification du code
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FasoResto-apk
          path: build/app/outputs/flutter-apk/app-release.apk
